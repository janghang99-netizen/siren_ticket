# 로컬 검증용: docker compose up -d --build  →  http://localhost:8090
# 접속 정보는 전부 로컬 개발용 값이다. 운영에 그대로 쓰지 말 것.
name: siren

x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8090
  APP_TIMEZONE: Asia/Seoul
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: siren
  DB_USERNAME: siren
  DB_PASSWORD: siren-local
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  # NFT 티켓 체인: local(기록만) / kaia(Kairos 테스트넷). 컨트랙트 주소는 nft:deploy 가 설정에 저장한다
  SIREN_NFT_CHAIN: kaia
  # 상품명 번역(Claude API) 키 — 호스트 환경 변수에서 넘겨받는다. 비어 있으면 상품명도 구글 번역이 맡는다
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  KOPIS_API_KEY: ${KOPIS_API_KEY:-}
  # SNS 로그인 키 (루트 .env 에 넣는다 — 비어 있으면 그 SNS 버튼이 숨는다)
  NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
  NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
  KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
  KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: siren
      MYSQL_USER: siren
      MYSQL_PASSWORD: siren-local
      MYSQL_ROOT_PASSWORD: siren-root-local
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3317:3306"   # 내 PC 에서만 접속 (같은 네트워크의 다른 기기에는 열지 않는다)
    volumes:
      - db-data:/var/lib/mysql
      - ./app/docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usiren", "-psiren-local"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: ./app
    image: siren-app
    environment: *app-env
    ports:
      - "8090:80"
    volumes:
      - app-storage:/var/www/html/storage/app   # 입점 서류 등 업로드 파일 (재빌드해도 유지)
    depends_on:
      db:
        condition: service_healthy

  # 미결제 주문 만료(캐파·재고 반환)를 매분 실행
  scheduler:
    image: siren-app
    environment:
      <<: *app-env
      SKIP_MIGRATE: "1"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app-storage:/var/www/html/storage/app   # 앱 키를 app 컨테이너와 같이 쓴다
    depends_on:
      app:
        condition: service_started

volumes:
  db-data:
  app-storage:
